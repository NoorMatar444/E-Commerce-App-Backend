services:

  backend:
    build:
      context: .
      target: development

    container_name: E-commerce-backend

    ports:
      - "3000:3000"

    env_file:
      - .env.docker

    depends_on:
      - mongodb
      - redis

    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules


  mongodb:
    image: mongo:latest

    container_name: E-commerce-mongodb

    ports:
      - "27018:27017"

    volumes:
      - mongodb_data:/data/db


  redis:
    image: redis:latest

    container_name: E-commerce-redis

    ports:
      - "6379:6379"


volumes:
  mongodb_data:
  backend_node_modules: